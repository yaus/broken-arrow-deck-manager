name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build]

      - name: Build packaged app
        run: |
          python -m PyInstaller --noconfirm --clean .\packaging\BrokenArrowDeckManager.spec

      - name: Archive packaged app
        run: |
          Compress-Archive -Path .\dist\BrokenArrowDeckManager\* -DestinationPath .\BrokenArrowDeckManager-windows.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: .\BrokenArrowDeckManager-windows.zip
          body_path: .\.github\release-notes\${{ github.ref_name }}.md

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: BrokenArrowDeckManager-windows
          path: .\BrokenArrowDeckManager-windows.zip
